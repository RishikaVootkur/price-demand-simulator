version: 2

sources:
  - name: m5
    description: M5 Forecasting CSVs loaded by ingest/load_m5.py
    schema: raw
    tables:
      - name: sales
        description: Daily unit sales, one row per item and store, one column per day (d_1 ... d_1941)
      - name: prices
        description: Weekly sell price per item and store
      - name: calendar
        description: One row per day, with Walmart week, events, and SNAP flags

  - name: open_meteo
    description: Daily weather loaded by ingest/load_weather.py
    schema: raw
    tables:
      - name: weather
        description: Daily temperature and rain, one row per state and date
