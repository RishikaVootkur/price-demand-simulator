[project]
name = "price-demand-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "kaggle>=2.2.5",
    # kaggle 2.2.5 imports six but does not declare it; remove once kaggle fixes this
    "requests>=2.34.2",
    "six>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
